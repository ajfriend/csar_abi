name: ci

# A bare `push:` alongside `pull_request:` runs every PR commit twice: both
# events fire for a same-repo branch, and the concurrency group below can't
# dedupe them (github.ref is refs/heads/<branch> for one and refs/pull/N/merge
# for the other). Restricting push to main gives each commit exactly one run —
# PRs via pull_request, main (including merge commits) via push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job running `just ci`, deliberately NOT the reference repo's
# recipe matrix: every recipe here finishes in seconds, so per-job
# setup (runner spinup, zig install, dependency fetch) would dominate
# five times over, and each independent csar-tarball fetch is its own
# network-flake chance. Reintroduce the matrix when a recipe grows
# past about a minute.
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: extractions/setup-just@v3
      - run: just ci
